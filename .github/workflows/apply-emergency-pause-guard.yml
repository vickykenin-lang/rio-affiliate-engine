name: Apply RIO Emergency Pause Guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_emergency_pause_guard.py'
      - '.github/workflows/apply-emergency-pause-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/apply_emergency_pause_guard.py
      - run: python -m py_compile scripts/autonomous_business_cycle.py
      - run: |
          set -e
          git config user.name "RIO Safety"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/autonomous_business_cycle.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "safety: enforce emergency pause before autonomous execution"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
