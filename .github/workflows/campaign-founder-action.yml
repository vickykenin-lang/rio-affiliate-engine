name: Campaign founder action
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Campaign ID shown on the dashboard
        required: true
        type: string
      action:
        description: Founder decision
        required: true
        type: choice
        options:
          - APPROVE_FOR_CREATIVE
          - APPROVE_TO_PUBLISH
          - REQUEST_CANDIDATE_CHANGES
          - REQUEST_CREATIVE_CHANGES
          - REJECT_CAMPAIGN
          - PAUSE_CAMPAIGN
      expected_revision:
        description: Exact revision shown on the dashboard
        required: true
        type: string
      category:
        description: Required only for correction actions
        required: false
        type: choice
        options: [OTHER, WRONG_PRODUCT, MISLEADING_VISUAL, COPY_ISSUE, DISCLOSURE_ISSUE, DESIGN_ISSUE, LINK_ISSUE]
      feedback:
        description: Exact correction requested
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: campaign-founder-actions
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Authorize repository Founder
        env: {ACTOR: '${{ github.actor }}'}
        run: test "$ACTOR" = "vickykenin-lang"
      - name: Apply governed transition
        env:
          CAMPAIGN_ID: '${{ inputs.campaign_id }}'
          CAMPAIGN_ACTION: '${{ inputs.action }}'
          EXPECTED_REVISION: '${{ inputs.expected_revision }}'
          CATEGORY: '${{ inputs.category }}'
          FEEDBACK: '${{ inputs.feedback }}'
          REQUEST_KEY: 'github-run:${{ github.run_id }}:${{ github.run_attempt }}'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          payload={'request_idempotency_key':os.environ['REQUEST_KEY']}
          if os.environ['CAMPAIGN_ACTION'].startswith('REQUEST_'):
              payload.update(category=os.environ['CATEGORY'],feedback=os.environ['FEEDBACK'])
          subprocess.run([sys.executable,'scripts/campaign_state.py','transition',os.environ['CAMPAIGN_ID'],os.environ['CAMPAIGN_ACTION'],'--actor-id','vickykenin-lang','--actor-role','FOUNDER','--expected-revision',os.environ['EXPECTED_REVISION'],'--payload-json',json.dumps(payload)],check=True)
          PY
      - name: Validate and regenerate projection
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_campaigns.py
          python scripts/generate_campaign_dashboard.py
      - name: Commit immutable decision
        env:
          CAMPAIGN_ID: '${{ inputs.campaign_id }}'
          CAMPAIGN_ACTION: '${{ inputs.action }}'
        run: |
          git config user.name "RIO Founder Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add "data/campaigns/${CAMPAIGN_ID}.json" site/content/campaign-dashboard.json
          git commit -m "campaign: ${CAMPAIGN_ACTION} ${CAMPAIGN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
