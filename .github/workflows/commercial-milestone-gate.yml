name: RIO Commercial Milestone Gate

on:
  push:
    branches: [main]
    paths:
      - 'data/revenue_m0_live_probe.json'
      - 'data/affiliate_attribution_state.json'
      - 'scripts/commercial_milestone_gate.py'
      - '.github/workflows/commercial-milestone-gate.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rio-commercial-milestone-gate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Evaluate evidence-gated commercial milestone
        run: python scripts/commercial_milestone_gate.py
      - name: Persist milestone truth
        run: |
          set -e
          git config user.name "RIO Commercial Gate"
          git config user.email "actions@users.noreply.github.com"
          git add data/commercial_milestone_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "revenue: persist evidence-gated commercial milestone"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
