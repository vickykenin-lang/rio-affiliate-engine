name: R12 RIO Safety Validation (NO PUBLISH)

# Stage 0: execute tests only on the isolated development branch.
# Cannot deploy, publish, modify account settings or invoke paid providers.
on:
  push:
    branches: [fix/r12-stage0-safety-20261014]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run negative and safety tests
        run: python -m unittest -v tests.test_r12_stage0_safety

      - name: Assemble allowlisted website OFFLINE
        run: python scripts/r12_site_guard.py --source site --output _public

      - name: Validate offline website package
        run: python scripts/r12_site_guard.py --verify-only --output _public

      - name: No deployment or publication
        run: echo "STAGE_0_VALIDATION_ONLY; NO_DEPLOYMENT; NO_PUBLISHING"
