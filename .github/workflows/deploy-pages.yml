name: Deploy RIO to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate complete site structure and links
        run: python scripts/validate.py

      - name: Validate public content compliance and truthful claims
        run: python scripts/validate_public_content.py

      - name: Validate X to X offer integrity
        run: python scripts/validate_offer_integrity.py

      - name: Validate product intelligence
        run: python scripts/validate_product_candidates.py

      - name: Validate CEO dashboard
        run: python scripts/validate_dashboard.py

      - name: Validate production offer gate
        run: python scripts/validate_production_offer_gate.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload RIO website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Python for production smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify real public production
        env:
          RIO_PUBLIC_SITE_BASE: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_production.py
