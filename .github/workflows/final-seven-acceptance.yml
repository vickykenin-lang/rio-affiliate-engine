name: RIO Final Seven Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/runtime_health.py'
      - 'scripts/rio_autonomous_executor.py'
      - 'scripts/dashboard_truth_model.py'
      - 'scripts/final_seven_regression.py'
      - '.github/workflows/final-seven-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/runtime_health.py'
      - 'scripts/rio_autonomous_executor.py'
      - 'scripts/dashboard_truth_model.py'
      - 'scripts/final_seven_regression.py'
      - '.github/workflows/final-seven-acceptance.yml'

permissions:
  contents: write

jobs:
  final-seven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile changed runtime scripts
        run: python -m py_compile scripts/runtime_health.py scripts/rio_autonomous_executor.py scripts/dashboard_truth_model.py scripts/final_seven_regression.py
      - name: Run final seven regression
        run: python scripts/final_seven_regression.py
      - name: Persist generated truth artifacts
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "RIO Acceptance" && git config user.email "actions@users.noreply.github.com"
          git add data/runtime_health.json data/dashboard_snapshot.json data/dashboard_truth_model.json data/commercial_milestone_state.json
          (git diff --cached --quiet || git commit -m "acceptance: persist final seven truth state")
          git pull --rebase --autostash
          git push
