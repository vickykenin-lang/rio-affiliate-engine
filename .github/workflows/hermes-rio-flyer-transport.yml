name: Hermes RIO Exact Flyer Transport

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Hermes command task id
        required: true
        type: string
      product_reference:
        description: Exact product identity (ASIN/SKU/verified URL/id)
        required: true
        type: string
      payload:
        description: Verified product package JSON including product_image_url
        required: true
        type: string
      preflight_only:
        description: Validate transport, secrets and quota without image download or provider inference
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

concurrency:
  group: rio-flyer-generation-v1
  cancel-in-progress: false

jobs:
  generate:
    # Stage 0 safeguard: manual dispatch cannot invoke providers or publish.
    # A separate approved release must re-enable this job.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Run governed flyer transport
        env:
          RIO_FLYER_TASK_ID: ${{ inputs.task_id }}
          RIO_PRODUCT_REFERENCE: ${{ inputs.product_reference }}
          RIO_FLYER_PAYLOAD: ${{ inputs.payload }}
          RIO_FLYER_PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          RIO_IMAGE_MONTHLY_PROVIDER_CALL_LIMIT: '30'
          RIO_IMAGE_MAX_ATTEMPTS: '2'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/rio_flyer_transport.py

      - name: Archive receipt for review only (never push to main)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rio-flyer-review-evidence
          if-no-files-found: ignore
          path: |
            integration/results/flyer_tasks/
            data/image_generation_usage.json
            creatives/generated/
