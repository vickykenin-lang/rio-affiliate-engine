name: RIO Live Image Generation Test

on:
  push:
    branches:
      - test/rio-live-image
    paths:
      - '.github/workflows/rio-live-image-test.yml'

permissions:
  contents: write

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Run one live RIO generation
        env:
          RIO_FLYER_TASK_ID: rio-live-socket-guard-20261002
          RIO_PRODUCT_REFERENCE: DDB11510-SOCKET-GUARD
          RIO_FLYER_PAYLOAD: '{"product_image_url":"https://duckduckbaby.in/cdn/shop/files/DDB11510_1.jpg?v=1722337488","title":"Child Safety Socket Guard","category":"Child Safety","creative_angle":"clean premium family-safety product advertising","target_audience":"parents of young children"}'
          RIO_FLYER_PREFLIGHT_ONLY: 'false'
          RIO_IMAGE_MONTHLY_PROVIDER_CALL_LIMIT: '30'
          RIO_IMAGE_MAX_ATTEMPTS: '1'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/rio_flyer_transport.py
          echo '--- receipt ---'
          cat integration/results/flyer_tasks/rio-live-socket-guard-20261002.json

      - name: Persist live test evidence on test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rio-live-test"
          git config user.email "actions@users.noreply.github.com"
          for path in integration/results/flyer_tasks data/image_generation_usage.json creatives/generated; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No evidence changes to persist."
            exit 0
          fi
          git commit -m "test: persist RIO live image generation evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
