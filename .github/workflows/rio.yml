name: RIO

on:
  schedule:
    - cron: '*/30 * * * *'   # heartbeat: every 30 minutes (Vicky, 2026-08-17 via Dr. Victor)
    - cron: '0 5 * * *'      # content review: once daily, ~10:30 IST (DeepSeek reviews live articles)
    - cron: '30 5 * * *'     # product discovery: once daily, ~11:00 IST (DeepSeek suggests search queries only)
    - cron: '30 13 * * *'    # instagram publish: once daily, ~19:00 IST (Vicky, 2026-08-18 via Dr. Victor)
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually (heartbeat / content-review / discover-products / instagram-publish / all)'
        type: choice
        default: heartbeat
        options: [heartbeat, content-review, discover-products, instagram-publish, all]

permissions:
  contents: write
  issues: write

concurrency: rio-state

jobs:
  heartbeat:
    if: |
      github.event_name == 'issues' ||
      github.event.schedule == '*/30 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'heartbeat' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read owner commands (kill switch / resume / messages), regenerate dashboard, run validators
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat.py
      - name: Commit state changes (GITHUB_TOKEN pushes do not trigger a second workflow; deployment runs explicitly)
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "heartbeat: refresh dashboard + validators") && git pull --rebase --autostash && git push

  content-review:
    if: |
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'content-review' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: DeepSeek reviews RIO's live articles as a skeptical Indian online shopper (conversion/trust QA, not product discovery)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/content_review.py
        continue-on-error: true
      - name: Commit report (NOT [skip ci] — harmless if it retriggers deploy-pages.yml, data/ isn't part of the site build)
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "content review: DeepSeek pass over live articles") && git pull --rebase --autostash && git push

  discover-products:
    if: |
      github.event.schedule == '30 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'discover-products' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: DeepSeek suggests search queries for content clusters with zero candidates (never a specific ASIN/price/URL — status is always DISCOVERY_REQUIRED, still needs real live verification next)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/discover_products.py
        continue-on-error: true
      - name: Commit new DISCOVERY_REQUIRED candidates
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "discovery: DeepSeek search-query suggestions (DISCOVERY_REQUIRED only)") && git pull --rebase --autostash && git push

  instagram-publish:
    if: |
      github.event.schedule == '30 13 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'instagram-publish' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Post the next eligible verified offer to Instagram (@riosallerior) — one per run, skips if kill switch on or validators failing
        env:
          IG_USER_ID_RIO: ${{ secrets.IG_USER_ID_RIO }}
          IG_ACCESS_TOKEN_RIO: ${{ secrets.IG_ACCESS_TOKEN_RIO }}
        run: python scripts/publish_instagram.py
      - name: Commit publish state + report line (NOT [skip ci] — harmless, data/ isn't part of the site build)
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "instagram: publish run") && git pull --rebase --autostash && git push
