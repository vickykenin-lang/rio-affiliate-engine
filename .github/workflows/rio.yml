name: RIO

on:
  push:
    branches: [main]
    paths:
      - 'data/instagram_approval.json'
      - 'data/production_control.json'
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '30 13 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual override only'
        type: choice
        default: heartbeat
        options: [heartbeat, content-review, discover-products, generate-creative, instagram-publish, telegram-test, telegram-direct, all]
      command_id: {description: 'Webhook command id', required: false, type: string}
      chat_id: {description: 'Telegram chat id', required: false, type: string}
      command_text: {description: 'Founder command', required: false, type: string}
      callback_url: {description: 'RIO callback URL', required: false, type: string}
permissions: {contents: read}
jobs:
  production-state:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.state.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - id: state
        name: Read canonical production state
        run: |
          python - <<'PY'
          import json, os
          state=json.load(open('data/production_control.json',encoding='utf-8')).get('production_state','PARKED')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('active=' + ('true' if state == 'ACTIVE' else 'false') + '\n')
          print('RIO production state:', state)
          PY

  heartbeat:
    needs: production-state
    permissions: {contents: write, issues: write}
    if: github.event_name == 'issues' || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'heartbeat' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency: {group: rio-heartbeat, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Mark heartbeat runner start
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p='data/heartbeat_runner_status.json'
          try:
              with open(p,encoding='utf-8') as f:d=json.load(f)
          except Exception:d={}
          d.update({'started_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),'event':'${{ github.event_name }}','schedule':'${{ github.event.schedule }}','run_id':'${{ github.run_id }}','state':'RUNNING'})
          with open(p,'w',encoding='utf-8') as f:json.dump(d,f,indent=2);f.write('\n')
          PY
      - name: Refresh health and validators
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
        run: python scripts/heartbeat.py
      - name: Continue Phase-2 objective from persistent memory
        if: needs.production-state.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/autonomous_business_cycle.py
      - name: Mark heartbeat runner success
        if: success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p='data/heartbeat_runner_status.json'
          try:
              with open(p,encoding='utf-8') as f:d=json.load(f)
          except Exception:d={}
          d.update({'finished_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),'state':'COMPLETED'})
          with open(p,'w',encoding='utf-8') as f:json.dump(d,f,indent=2);f.write('\n')
          PY
      - name: Persist heartbeat and validated autonomous work
        if: success()
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          python scripts/stage_autonomous_changes.py
          git add data/inbox.json data/soul_runtime_status.json
          (git diff --cached --quiet || git commit -m "heartbeat: governed health state") && git pull --rebase --autostash && git push
      - name: Notify heartbeat failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
        run: python scripts/telegram_notify.py "🔴 RIO HEARTBEAT RUNNER FAILED. Health/Soul/autonomous cycle did not complete. Existing safety gates remain in force."
  content-review:
    needs: production-state
    permissions: {contents: write}
    if: needs.production-state.outputs.active == 'true' && (github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'content-review' || inputs.job == 'all')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - env: {DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"}
        run: python scripts/content_review.py
        continue-on-error: true
      - run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/content_review_report.json data/status.json
          (git diff --cached --quiet || git commit -m "content review: DeepSeek pass over live articles") && git pull --rebase --autostash && git push
  discover-products:
    needs: production-state
    permissions: {contents: write}
    if: needs.production-state.outputs.active == 'true' && (github.event.schedule == '30 5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'discover-products' || inputs.job == 'all')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - env: {DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"}
        run: python scripts/discover_products.py
        continue-on-error: true
      - run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/product_candidates.csv product_candidates.csv
          (git diff --cached --quiet || git commit -m "discovery: DeepSeek search-query suggestions") && git pull --rebase --autostash && git push
  generate-creative:
    needs: production-state
    permissions: {contents: write}
    if: needs.production-state.outputs.active == 'true' && (github.event.schedule == '30 5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'generate-creative' || inputs.job == 'all')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - env: {DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"}
        run: python scripts/generate_creative.py
        continue-on-error: true
      - run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/creative_approval_queue.json site/creatives
          (git diff --cached --quiet || git commit -m "creative: draft pending offers for dashboard approval") && git pull --rebase --autostash && git push
  instagram-publish:
    needs: production-state
    permissions: {contents: write}
    if: needs.production-state.outputs.active == 'true' && ((github.event_name == 'push' && github.actor != 'github-actions[bot]') || github.event.schedule == '30 13 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'instagram-publish' || inputs.job == 'all')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - id: publish
        continue-on-error: true
        env: {IG_USER_ID_RIO: "${{ secrets.IG_USER_ID_RIO }}", IG_ACCESS_TOKEN_RIO: "${{ secrets.IG_ACCESS_TOKEN_RIO }}"}
        run: python scripts/publish_instagram.py
      - if: always()
        run: |
          python scripts/generate_dashboard.py
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/ig_published.json data/instagram_approval.json data/instagram_run_status.json data/rio_report_to_victor.md data/dashboard_snapshot.json data/ceo_action_queue.csv site/dashboard/index.html
          (git diff --cached --quiet || git commit -m "instagram: publish run") && git pull --rebase --autostash && git push
      - if: steps.publish.outcome == 'failure'
        run: exit 1
  telegram-test:
    permissions: {contents: read}
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'telegram-test' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - env: {TELEGRAM_BOT_TOKEN_RIO: "${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}", TELEGRAM_CHAT_ID_RIO: "${{ secrets.TELEGRAM_CHAT_ID_RIO }}"}
        run: python scripts/telegram_notify.py --test
  telegram-direct:
    permissions: {contents: write}
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'telegram-direct'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: {group: rio-telegram-direct, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - name: Execute Founder command
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RIO_CALLBACK_TOKEN: ${{ secrets.RIO_CALLBACK_TOKEN }}
          RIO_COMMAND_ID: ${{ inputs.command_id }}
          RIO_COMMAND_CHAT_ID: ${{ inputs.chat_id }}
          RIO_COMMAND_TEXT: ${{ inputs.command_text }}
          RIO_CALLBACK_URL: ${{ inputs.callback_url }}
        run: python scripts/telegram_direct_command.py
      - name: Commit validated autonomous changes
        if: success()
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/rio_work_status.json data/status.json data/control.json data/inbox.json site/rio-dashboard/index.html rio-dashboard/index.html
          (git diff --cached --quiet || git commit -m "rio webhook: apply validated Founder instruction")
          git pull --rebase --autostash
          git push
      - name: Persist dashboard failure state only
        if: failure()
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data/rio_work_status.json site/rio-dashboard/index.html rio-dashboard/index.html || true
          (git diff --cached --quiet || git commit -m "rio dashboard: record command failure")
          git pull --rebase --autostash
          git push
      - name: Notify command failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
        run: python scripts/telegram_notify.py "⚠️ RIO command failed. The direct runner, AI/executor, validation, or workflow may have failed. No unvalidated change should be treated as completed."
